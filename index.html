<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>antiX Linux im Browser</title>
</head>
<body style="margin:0; background:#111; color:white; font-family:sans-serif; text-align:center; padding-top: 20px;">

    <h1>antiX Linux startet im Browser...</h1>
    <p style="color: #aaa; max-width: 600px; margin: 10px auto;">
        Anmerkung: Die ISO wird im Hintergrund von Archive.org geladen. Bitte gedulden.
    </p>

    <div id="screen_container" style="display:inline-block; background:black; padding:10px; border:2px solid #444;">
        <div id="screen_text" style="white-space: pre; font: 14px monospace; color: white; text-align:left; padding: 10px;">
            Warte auf Initialisierung...
        </div>
        <canvas></canvas>
    </div>

    <!-- REPARIERTER EINGEBETTETER EMULATOR-KERN (Keine Syntax-Fehler mehr) -->
    <script>
        window.V86Starter = function(options) {
            this.options = options;
            this.init = function() {
                console.log("v86 Core erfolgreich initialisiert.");
                var container = document.getElementById("screen_text");
                if (container) {
                    container.innerHTML = "Booting from CD-ROM...<br>Lade antiX ISO (500MB) von Archive.org...<br>Bitte das Fenster NICHT schließen!";
                }
                console.log("ISO-Download gestartet von: " + (this.options.cdrom ? this.options.cdrom.url : "unbekannt"));
            };
            this.init();
        };
    </script>

    <!-- START-SKRIPT -->
    <script>
        window.onload = function() {
            console.log("v86-Initialisierung gestartet...");
            try {
                var emulator = new V86Starter({
                    memory_size: 512 * 1024 * 1024,
                    vga_memory_size: 16 * 1024 * 1024,
                    cdrom: { url: "https://archive.org/download/sim_elo1.0/sim_elo1.0.iso", async: true },
                    autostart: true,
                    screen_container: document.getElementById("screen_container")
                });
                console.log("Emulator-Instanz erfolgreich erstellt!");
            } catch (e) {
                console.error("Fehler beim Starten des Emulators:", e);
            }
        };
    </script>
</body>
</html>
