<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>antiX Linux im Browser (Experiment)</title>
    <!-- Wechsel auf cdnjs: Garantiert die richtige JavaScript-Datei -->
    <script src="https://cloudflare.com"></script>
</head>
<body style="margin:0; background:#111; color:white; font-family:sans-serif; text-align:center; padding-top: 20px;">

    <h1>antiX Linux startet im Browser...</h1>
    <p style="color: #aaa; max-width: 600px; margin: 10px auto;">
        Anmerkung: Die ISO wird im Hintergrund geladen. Bei großen Dateien kann es mehrere Minuten dauern, bis die ersten Ausgaben auf dem Bildschirm erscheinen!
    </p>

    <div id="screen_container" style="display:inline-block; background:black; padding:10px; border:2px solid #444;">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px; color: white; text-align:left;"></div>
        <canvas></canvas>
    </div>

    <script>
        window.onload = function() {
            var emulator = new V86Starter({
                // Wasm und BIOS-Pfade ebenfalls auf das stabile cdnjs-Netzwerk umgestellt
                wasm_path: "https://cloudflare.com",
                memory_size: 1024 * 1024 * 1024, // 1 GB RAM
                vga_memory_size: 32 * 1024 * 1024,

                bios: { url: "https://cloudflare.com" },
                vga_bios: { url: "https://cloudflare.com" },

                // Deine ISO von archive.org
                cdrom: { url: "https://archive.org/download/sim_elo1.0/sim_elo1.0.iso", async: true },

                autostart: true,
                screen_container: document.getElementById("screen_container"),
            });
        };
    </script>
</body>
</html>
