<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>antiX Linux im Browser (Experiment)</title>
    <!-- Lädt das Skript jetzt direkt lokal aus deinem Repository ohne CDN-Fehler -->
    <script src="libv86.js"></script>
</head>
<body style="margin:0; background:#111; color:white; font-family:sans-serif; text-align:center; padding-top: 20px;">

    <h1>antiX Linux startet im Browser...</h1>
    <p style="color: #aaa; max-width: 600px; margin: 10px auto;">
        Anmerkung: Die ISO wird im Hintergrund geladen. Bei 500 MB kann es mehrere Minuten dauern, bis die ersten Ausgaben erscheinen!
    </p>

    <div id="screen_container" style="display:inline-block; background:black; padding:10px; border:2px solid #444;">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px; color: white; text-align:left;"></div>
        <canvas></canvas>
    </div>

    <script>
        window.onload = function() {
            console.log("v86 wird initialisiert...");
            var emulator = new V86Starter({
                wasm_path: "https://jsdelivr.net",
                memory_size: 512 * 1024 * 1024,
                vga_memory_size: 16 * 1024 * 1024,

                bios: { url: "https://jsdelivr.net" },
                vga_bios: { url: "https://jsdelivr.net" },

                cdrom: { url: "https://archive.org/download/sim_elo1.0/sim_elo1.0.iso", async: true },

                autostart: true,
                screen_container: document.getElementById("screen_container"),
            });
            console.log("Emulator-Instanz erfolgreich erstellt!");
        };
    </script>
</body>
</html>
